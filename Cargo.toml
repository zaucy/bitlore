[package]
name = "bitlore"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bitlore-server"
path = "src/main.rs"

[[bin]]
name = "bitlore-peer"
path = "src/bin/bitlore_peer.rs"

[lib]
name = "bitlore"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
async-stream = "0.3.6"
async-trait = "0.1.92"
bitflags = "2.9.4"
blake3 = "1.8.2"
bytes = { version = "1.11.1", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive", "string", "unicode"] }
dashmap = "6.1.0"
futures = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
lz4-sys = "1.11"
parking_lot = { version = "0.12.4", features = ["arc_lock"] }
prost = "0.14.1"
prost-types = "0.14.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
rcgen = "0.14.4"
rustls = { version = "0.23.31", default-features = false, features = ["std", "logging", "ring"] }
rustls-pki-types = "1.13.1"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.143", default-features = false }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["sync"] }
toml = "0.9.5"
tonic = { version = "0.14.2", default-features = false, features = ["codegen", "router", "server", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", default-features = false, features = ["v4", "v7"] }
zerocopy = { version = "0.8.26", features = ["derive", "alloc", "simd"] }
zstd-sys = { version = "2.0", default-features = false, features = ["experimental"] }

[dev-dependencies]
tempfile = "3.21"
